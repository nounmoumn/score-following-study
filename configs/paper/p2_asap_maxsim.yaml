# P2 검증 — ASAP, 온라인 vs 오프라인 추적 오차 격차(GAP). 설계: FEEDBACK.md
# "P2 설계 (온라인 vs 오프라인 격차)" 절 (전략 트랙, 2026-09-08).
# GAP(t) = online_err(t) - offline_err(t). 기대: 모호한 구간일수록 GAP이 커짐.
# 나머지 설정(band_width, health_threshold 등)은 p1_asap_maxsim.yaml과 통일 —
# P1과 같은 조건 위에서 온라인/오프라인 비교만 추가하는 것이므로.
experiment: p2_asap_maxsim
kind: p2_asap_gap
seed: 42
ambiguity_metric: maxsim

data:
  asap_root: asap_dataset
  n_pieces: 40
  diverse_sampling: true

feature:
  frame_hop_sec: 0.1
  ambiguity_window_sec: 2.0
  ambiguity_exclude_sec: 2.0
  transpose_invariant: false   # p1_asap_maxsim.yaml과 동일 조건 유지

tracker:
  band_width_sec: 20.0   # p1_asap_maxsim.yaml과 동일 (= 200프레임)
  max_run_count: 3

evaluation:
  health_threshold_sec: 1.0   # 온라인 중앙값 오차 기준 (P1과 동일 임계값·이유)
  n_shuffles: 200
