# P2 검증 — week4 실제 기타 녹음(만찬가), 외적 타당성 확인.
# ASAP(p2_asap_maxsim.yaml)이 먼저 성립을 확인한 뒤 진행 — FEEDBACK.md "P2 설계" 절
# "ASAP(대규모) 먼저 → 성립하면 week4". 나머지 조건은 p1_week4_bansanka.yaml과 통일.
#
# ⚠️ 녹음(61.58초)이 스코어(90초로 자름)의 접두어(prefix)뿐이라 오프라인 DTW는
# open_end=True(끝점 자유)를 쓴다 — run_p2_week4_gap 참조.
experiment: p2_week4_bansanka
kind: p2_week4_gap
seed: 42
ambiguity_metric: maxsim

data:
  song_package: "${week4_root}/build/mode1/bansanka_original_key/song_package.json"
  performance_wav: "${week4_root}/output/audio/guitar_tests/bansanka_previous_guitar_take_recovered.wav"
  recording_length_sec: 61.58
  score_max_sec: 90.0

feature:
  frame_hop_sec: 0.1
  ambiguity_window_sec: 2.0
  ambiguity_exclude_sec: 2.0
  transpose_invariant: true

tracker:
  band_width_sec: 5.0   # p1_week4_bansanka.yaml과 동일
  max_run_count: 3
