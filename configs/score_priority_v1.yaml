score_profile:
  representation: duration_weighted_pitch_class_l2
  grid_quarter_beats: 0.25
  block_quarter_beats: 4
  context_quarter_beats: 4
  candidate_stride_quarter_beats: 0.25
  exclusion_start_distance_quarter_beats: 4
  transpose_invariant: false
  silence_similarity: 0
  final_partial_block: exclude
  all_silent_block_priority: lowest
  tie_break: sha256_score_hash_block_index_seed
  modify_historical_ambiguity_module: false
selection:
  primary_fraction: 0.20
  secondary_fractions: [0.10, 0.30, 0.50]
  k_rule: ceil_fraction_times_eligible_blocks
  main: ordered_chroma_maxsim
  baselines: [uniform_random_expectation, unordered_chroma_maxsim, note_density_high, note_density_low]
  real_output: score_block_ids_and_quarter_beat_ranges
tracking:
  input: direct_performance_midi
  performance_hop_sec: 0.1
  score_hop_native_midi_sec: 0.1
