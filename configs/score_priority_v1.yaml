  error_units: midi_quarter_beats
  primary_error_threshold_strictly_greater: 1.0
  secondary_error_thresholds: [0.5, 2.0]
  primary_block_loss: fraction_of_original_gt_anchors_with_error
  aggregation: equal_work_then_equal_performance
  bootstrap_unit: work_family
  bootstrap_replicates: 10000
  intervals: descriptive_95_percent
  primary_capture_gain_random_min: 0.10
  primary_capture_gain_each_nonrandom_baseline_min: 0.05
  primary_lower_ci_each_gain_must_exceed: 0.0
  min_error_bearing_work_families: 10
  min_work_families_for_decision: 20
  missing_predictions: error_with_missing_flag
  no_error_works: retain_and_report
  statistical_claim: retrospective_exploratory_not_confirmatory
resources:
  python: .venv/Scripts/python.exe
  workers: 2
  blas_threads_per_worker: 1
  soft_total_rss_gib: 10
  gpu: false
  colab: false
  max_research_wall_hours_from_execution_start: 6
  max_implementation_and_audit_hours: 2
  primary_run_budget_hours: 2
  replication_and_report_budget_hours: 2
  failure_parameter_search: forbidden
optional:
  tracker_selection_policy: false
  new_corpus_acquisition: false
  p3_signal_search: false
  primary_hypothesis_replacement: false
