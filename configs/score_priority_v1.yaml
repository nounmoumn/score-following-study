  initial_position: known_score_beginning
  primary:
    family: OnlineDTW
    band_width_frames: 200
    max_run_count: 3
    stop_at_performance_end: true
    artificial_tail: forbidden
  secondary:
    family: existing_full_posterior_bayes
    transition: [0.2, 0.65, 0.1, 0.05]
